<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mans konts — OCTA braucēja rādītājs</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="mini.css?v=20261028v">
</head>
<body>
<main class="mini" style="max-width:900px">
  <h1>Mans konts <small id="who"></small></h1>
  <p id="msg" class="note">Ielādē…</p>
  <section class="card" id="score" hidden></section>
  <section class="card" id="adv" hidden></section>
  <section class="card" id="carsCard" hidden>
    <h3 style="margin-top:0">Mani auto</h3>
    <p class="note">CSDD reģistram mums nav piekļuves, tāpēc auto datus ievadi pats (tie tiek atzīmēti kā <b>pašdeklarēti, nepārbaudīti</b>).</p>
    <div id="carList"></div>
    <details id="addBox"><summary class="btn" style="display:inline-block;cursor:pointer">+ Pievienot auto</summary>
      <form id="carForm" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:12px">
        <label>Numura zīme* <input id="plate" required maxlength="10" placeholder="AB1234" autocapitalize="characters"></label>
        <label>Marka* <input id="make" required maxlength="30" placeholder="Volkswagen"></label>
        <label>Modelis* <input id="model" required maxlength="30" placeholder="Golf"></label>
        <label>Izlaiduma gads <input id="year" type="number" min="1950" max="2027" placeholder="2015"></label>
        <label>Degviela <select id="fuel"><option value="">–</option><option value="petrol">benzīns</option><option value="diesel">dīzelis</option><option value="hybrid">hibrīds</option><option value="phev">pieslēdzamais hibrīds</option><option value="electric">elektro</option><option value="lpg">gāze</option><option value="other">cits</option></select></label>
        <label>Dzinēja tilpums, cm³ <input id="cc" type="number" min="0" max="10000" placeholder="1598"></label>
        <label>Jauda, kW <input id="kw" type="number" min="0" max="1500" placeholder="77"></label>
        <label>Nobraukums, km <input id="odo" type="number" min="0" max="3000000"></label>
        <label>VIN (nav obligāts) <input id="vin" maxlength="17"></label>
        <label>Reģ. apliecības nr. <input id="cert" maxlength="20"></label>
        <label>OCTA derīga līdz <input id="octa" type="date"></label>
        <label>Negadījumi pēdējos 3 gados <input id="claims" type="number" min="0" max="20" value="0"></label>
        <div style="grid-column:1/-1"><button class="btn" type="submit" id="carGo">Saglabāt auto</button> <span id="carMsg" class="note"></span></div>
      </form>
    </details>
  </section>
  <section class="card" id="trips" hidden></section>
  <div class="row" style="gap:8px"><a class="btn" href="collect.html">Sākt braucienu</a><button class="btn" id="out" type="button" style="opacity:.7">Iziet</button></div>
  <p class="note"><a href="./">← uz demo</a> · <a href="live.html">dzīvie simulatora braucieni</a></p>
</main>
<script src="engine.js?v=20261028v"></script>
<script src="auth.js?v=20261028v"></script>
<script>
(function () {
  var E = window.Engine, $ = function (id) { return document.getElementById(id); }, REST = Auth.URL + '/rest/v1/';
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var bandLv = { low: 'zems risks', medium: 'vidējs risks', high: 'augsts risks' }, cls = function (b) { return b === 'low' ? 'good' : b === 'medium' ? 'mid' : 'bad'; };
  var FUEL = { petrol: 'benzīns', diesel: 'dīzelis', hybrid: 'hibrīds', phev: 'pieslēdzamais hibrīds', electric: 'elektro', lpg: 'gāze', other: 'cits' };
  var FACT = { speeding: 'ātrums', smooth: 'plūdums', phone: 'telefons', nightfatigue: 'nakts/nogurums' };
  $('out').onclick = function () { Auth.logout(); location.href = 'login.html'; };
  var u = Auth.user(); if (!u) { location.replace('login.html'); return; }
  $('who').textContent = (u.name || '') + ' · ' + (u.email || '');
  function toEngine(t) { return { id: t.id, startISO: new Date(t.start_at).toISOString(), mode: t.mode, roleConf: t.role_conf, counted: t.counted, weather: t.weather, durationS: t.duration_s, km: t.km, darkKm: t.dark_km, brake: t.brake, accel: t.accel, corner: t.corner, overLimS: t.over_lim_s, overSafeS: t.over_safe_s, severeS: t.severe_s, phoneEv: t.phone_ev, phoneS: t.phone_s, parkings: t.parkings, lotCycles: t.lot_cycles, lotS: t.lot_s, lotOverS: t.lot_over_s, surge: t.surge, bump: t.bump }; }
  var H, driver;
  var g = function (q) { return fetch(REST + q, { headers: H }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }); };
  var send = function (method, path, body) { return fetch(REST + path, { method: method, headers: Object.assign({ 'Content-Type': 'application/json', Prefer: 'return=minimal' }, H), body: body ? JSON.stringify(body) : undefined }).then(function (r) { return r.text().then(function (t) { if (!r.ok) { var j = {}; try { j = JSON.parse(t); } catch (e) {} throw new Error(j.message || String(r.status)); } }); }); };

  function loadCars() {
    return g('cars?select=*&created_by=eq.' + encodeURIComponent(u.uid) + '&order=created_at.asc').then(function (cars) {
      $('carList').innerHTML = cars.length ? '<div style="overflow-x:auto"><table><tr><th>Numurs</th><th>Auto</th><th class="num">Gads</th><th>Degviela</th><th class="num">kW</th><th>OCTA līdz</th><th class="num">Negad.</th><th></th></tr>' +
        cars.map(function (c) { return '<tr><td><b>' + esc(c.plate) + '</b></td><td>' + esc(c.make || '') + ' ' + esc(c.model || c.name) + '</td><td class="num">' + (c.year || '–') + '</td><td>' + (FUEL[c.fuel] || '–') + '</td><td class="num">' + (c.power_kw || '–') + '</td><td>' + (c.octa_valid_until || '–') + '</td><td class="num">' + c.claims_3y + '</td><td><button class="btn" data-del="' + esc(c.id) + '" type="button" style="opacity:.7">Dzēst</button></td></tr>'; }).join('') + '</table></div>' : '<p class="note">Vēl nav neviena auto. Pievieno pirmo, lai braucieni tiktu piesaistīti auto.</p>';
      Array.prototype.forEach.call(document.querySelectorAll('[data-del]'), function (b) { b.onclick = function () { if (!confirm('Dzēst šo auto?')) return; send('DELETE', 'driver_cars?car_id=eq.' + encodeURIComponent(b.dataset.del)).then(function () { return send('DELETE', 'cars?id=eq.' + encodeURIComponent(b.dataset.del)); }).then(loadCars).catch(function (e) { $('carMsg').textContent = 'Neizdevās dzēst: ' + e.message; }); }; });
    });
  }
  function rnd() { var a = new Uint8Array(4); crypto.getRandomValues(a); return Array.prototype.map.call(a, function (x) { return ('0' + x.toString(16)).slice(-2); }).join(''); }
  $('carForm').onsubmit = function (e) {
    e.preventDefault(); $('carGo').disabled = true; $('carMsg').textContent = 'Saglabā…';
    var n = function (id) { var v = $(id).value; return v === '' ? null : Number(v); }, t = function (id) { var v = $(id).value.trim(); return v === '' ? null : v; };
    var plate = $('plate').value.toUpperCase().replace(/[^A-Z0-9-]/g, ''), make = $('make').value.trim(), model = $('model').value.trim(), id = 'c-' + driver.id.replace(/^u-/, '') + '-' + rnd();
    send('POST', 'cars', { id: id, name: (make + ' ' + model).slice(0, 40), plate: plate, make: make, model: model, year: n('year'), fuel: t('fuel'), engine_cc: n('cc'), power_kw: n('kw'), odometer_km: n('odo'), vin: t('vin') && t('vin').toUpperCase(), reg_cert_no: t('cert'), octa_valid_until: t('octa'), claims_3y: n('claims') || 0, is_demo: false, created_by: u.uid })
      .then(function () { return send('POST', 'driver_cars', { driver_id: driver.id, car_id: id }); })
      .then(function () { $('carForm').reset(); $('carMsg').textContent = 'Auto pievienots.'; $('addBox').open = false; return loadCars(); })
      .catch(function (er) { $('carMsg').textContent = /duplicate|unique|23505/i.test(er.message) ? 'Šāds numurs jau ir pievienots.' : /check|violates/i.test(er.message) ? 'Pārbaudi ievadītos datus (numura zīme: burti, cipari, defise).' : 'Kļūda: ' + er.message; })
      .then(function () { $('carGo').disabled = false; });
  };

  function advice() {
    $('adv').hidden = false; $('adv').innerHTML = '<p class="note">Analizē datus…</p>';
    fetch(Auth.URL + '/functions/v1/recommend', { method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, H), body: JSON.stringify({ subject_type: 'driver', id: driver.id, lang: 'lv' }) }).then(function (x) { return x.json(); }).then(function (a) {
      if (!a.actions) { $('adv').innerHTML = '<p class="note">Padoms šobrīd nav pieejams.</p>'; return; }
      var j = a.jev ? '<p class="note">🔎 Datu analīze (Jev): sāc ar <b>' + (FACT[a.jev.start_here] || a.jev.start_here) + '</b> (pārliecība ' + Math.round(a.jev.start_conf * 100) + ' %)' + (a.jev.risk_score != null ? ' · riska profils ' + a.jev.risk_score.toFixed(1) + ' / 2' : '') + '</p>' : '';
      $('adv').innerHTML = '<b>Kā maksāt mazāk par OCTA</b> <span class="badge b-mute">' + (a.source === 'gemini' ? 'Gemini' : 'sagataves padoms') + '</span>' + j + '<p>' + esc(a.summary) + '</p>' +
        a.actions.map(function (x, i) { return '<p><b>' + (i === 0 && a.jev ? '① ' : '') + esc(x.title) + '</b> <small>+' + x.gainPoints + ' punkti' + (x.savingEur > 0 ? ' · −' + x.savingEur + ' €' : '') + '</small><br>' + esc(x.tip) + '</p>'; }).join('') + '<p class="note">Skaitļus rēķina dzinējs; analīzi veic Jev; tekstu raksta MI modelis.</p>';
    }).catch(function () { $('adv').innerHTML = '<p class="note">Padoms šobrīd nav pieejams.</p>'; });
  }

  Auth.token().then(function (tok) {
    if (!tok) { location.replace('login.html'); return; }
    H = { apikey: Auth.KEY, Authorization: 'Bearer ' + tok };
    return g('drivers?select=id,name,exp_hours,exp_buckets,claims_3y&user_id=eq.' + encodeURIComponent(u.uid)).then(function (ds) {
      driver = ds[0]; if (!driver) throw new Error('profile');
      $('carsCard').hidden = false;
      return Promise.all([loadCars(), g('trips?select=*&order=start_at.desc&limit=500&driver_id=eq.' + encodeURIComponent(driver.id))]);
    }).then(function (r) {
      var trips = r[1];
      if (!trips.length) { $('msg').innerHTML = 'Vēl nav neviena brauciena. Pievieno auto, spied <b>Sākt braucienu</b>, atstāj lapu atvērtu un brauc — kopsavilkums parādīsies šeit.'; return; }
      $('msg').textContent = trips.length + ' braucieni · ' + new Date().toLocaleTimeString('lv-LV');
      var prof = { claims3y: driver.claims_3y || 0, expHours: Number(driver.exp_hours || 0), expBuckets: driver.exp_buckets || {} };
      var res = E.scoreDriver(trips.map(toEngine), prof), pr = E.premiumPreview(res.total);
      $('score').hidden = false;
      $('score').innerHTML = '<div class="row" style="justify-content:space-between;align-items:center"><div><b style="font-size:2rem">' + res.total + '</b> <small>± ' + res.sigma + ' / 100</small> <span class="pill ' + cls(res.band) + '">' + bandLv[res.band] + '</span><br><small>' + res.kpi.km.toFixed(1) + ' km · ' + res.kpi.trips + ' braucieni</small></div><div style="text-align:right"><b>' + pr.eur + ' €</b> <small>−' + pr.discountPct + '% (ilustratīvi, nav Balcia cena)</small></div></div>';
      if (window.AI_ON) advice();
      $('trips').hidden = false;
      $('trips').innerHTML = '<h3 style="margin-top:0">Braucieni</h3><div style="overflow-x:auto"><table><tr><th>Laiks</th><th class="num">km</th><th class="num">min</th><th class="num">Bremz.</th><th class="num">Paātr.</th><th class="num">Pagr.</th><th class="num">Virs limita, s</th><th>Laikapst.</th><th>Avots</th></tr>' +
        trips.slice(0, 50).map(function (t) { return '<tr><td>' + new Date(t.start_at).toLocaleString('lv-LV') + '</td><td class="num">' + t.km.toFixed(2) + '</td><td class="num">' + (t.duration_s / 60).toFixed(1) + '</td><td class="num">' + t.brake + '</td><td class="num">' + t.accel + '</td><td class="num">' + t.corner + '</td><td class="num">' + t.over_lim_s.toFixed(0) + '</td><td>' + esc(t.weather) + '</td><td>' + esc(t.source) + '</td></tr>'; }).join('') + '</table></div>';
    });
  }).catch(function (e) { $('msg').textContent = 'Kļūda: ' + e.message + ' — mēģini pieteikties vēlreiz.'; });
})();
</script>
</body>
</html>
